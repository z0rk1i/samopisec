name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cljs:
    name: CLJS lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12
        with:
          cli: 1.12.0.1495
          clj-kondo: 2026.08.04
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Lint
        run: clj-kondo --lint src test
      - name: CLJS unit tests
        run: |
          clojure -M -m shadow.cljs.devtools.cli compile test
          node target/test/test.js

  swift:
    name: Swift widget config tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: |
          swiftc targets/widget/WidgetConfig.swift targets/widget/WidgetConfigTests.swift -o /tmp/wc_test
          /tmp/wc_test

  kotlin:
    name: Kotlin widget unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
      - run: npm ci
      - name: Run :app unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain