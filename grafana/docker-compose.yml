services:
  grafana:
    image: grafana/grafana:11.5.2
    container_name: samopisec-grafana
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_COOKIE_SAMESITE: none
      GF_SERVER_HTTP_PORT: "3000"
      GF_INSTALL_PLUGINS: marcusolsson-csv-datasource,grafana-clock-panel
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/var/lib/grafana/dashboards
      - /tmp/samopisec.csv:/tmp/samopisec.csv:ro
    restart: unless-stopped

  csv-server:
    image: python:3.12-alpine
    container_name: samopisec-csv-server
    command: ["python", "-m", "http.server", "8000", "--directory", "/data"]
    ports:
      - "0.0.0.0:8001:8000"
    volumes:
      - /tmp:/data:ro
    restart: unless-stopped

  uploader:
    image: python:3.12-alpine
    container_name: samopisec-uploader
    ports:
      - "0.0.0.0:8002:8002"
    volumes:
      - ./uploader:/app:ro
      - /tmp:/tmp
    command: ["python", "/app/server.py"]
    restart: unless-stopped
