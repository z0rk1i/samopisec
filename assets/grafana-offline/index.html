<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samopisec Grafana (offline)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0c0e;color:#d8dee9;font-family:-apple-system,BlinkMacSystemFont,Inter,Roboto,sans-serif}
  header{padding:12px 16px;background:#111217;border-bottom:1px solid #2a2a2e;display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:16px;font-weight:600;color:#fff}
  header span{font-size:12px;color:#9ba0b0}
  .grid{padding:12px;display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
  .panel{background:#1f1f23;border:1px solid #2a2a2e;border-radius:6px;padding:12px}
  .panel h2{margin:0 0 8px 0;font-size:13px;font-weight:600;color:#c2c8d6;letter-spacing:.02em;text-transform:uppercase}
  canvas{width:100%;height:180px;display:block}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px 8px;border-bottom:1px solid #2a2a2e;text-align:left}
  th{color:#8a90a3;font-weight:600}
  .empty{padding:24px;text-align:center;color:#8a90a3;font-size:13px}
  .pill{padding:2px 8px;border-radius:10px;background:#2a2a2e;color:#d8dee9;font-size:11px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#c2c8d6}
  .legend-dot{width:10px;height:10px;border-radius:5px}
  .panel h2 .unit{text-transform:none;font-weight:400;color:#8a90a3;font-size:11px;letter-spacing:0}
</style>
</head>
<body>
<header>
  <h1>Samopisec</h1>
  <span id="subtitle">offline • Grafana style • по кнопкам</span>
  <span style="flex:1"></span>
  <span class="pill" id="total">—</span>
</header>
<div class="grid">
  <div class="panel" id="p-cumulative"><h2>Cumulative (per button)</h2><div id="legend-cumulative" class="legend"></div><canvas id="c-cumulative" width="600" height="220"></canvas><div id="e-cumulative" class="empty" style="display:none">нет данных</div></div>
  <div class="panel" id="p-p1"><h2>Производная 1 <span class="unit">нажатий/час</span></h2><div id="legend-p1" class="legend"></div><canvas id="c-p1" width="600" height="220"></canvas><div id="e-p1" class="empty" style="display:none">нет данных</div></div>
  <div class="panel" id="p-p2"><h2>Производная 2 <span class="unit">Δ нажатий/час²</span></h2><div id="legend-p2" class="legend"></div><canvas id="c-p2" width="600" height="220"></canvas><div id="e-p2" class="empty" style="display:none">нет данных</div></div>
  <div class="panel" id="p-totals"><h2>Totals per button</h2><canvas id="c-totals" width="600" height="220"></canvas><div id="e-totals" class="empty" style="display:none">нет данных</div></div>
  <div class="panel" id="p-raw"><h2>Raw CSV</h2><div style="max-height:220px;overflow:auto"><table id="t-raw"><thead><tr><th>id</th><th>button_id</th><th>ts</th><th>time</th></tr></thead><tbody></tbody></table></div><div id="e-raw" class="empty" style="display:none">нет данных</div></div>
</div>
<script>
// Все данные приходят ГОТОВЫМИ из приложения (app.grafana-series, CLJS:
// app.math + decimation) через window.SAMOPISEC_SERIES. Здесь только отрисовка:
// без парсинга CSV и без второй реализации математики производных.
function fmtTime(ts){
  try{return new Date(ts).toLocaleString()}catch(e){return String(ts)}
}
function fmtNum(v){
  const a=Math.abs(v);
  if(a>=100) return String(Math.round(v));
  if(a>=10) return v.toFixed(1);
  return v.toFixed(2);
}
function show(id,on){
  document.getElementById(id).style.display=on?"block":"none";
}
function fillLegend(id,btns){
  const legend=document.getElementById(id);
  legend.innerHTML="";
  btns.forEach(b=>{
    const el=document.createElement("div");
    el.className="legend-item";
    const dot=document.createElement("span");
    dot.className="legend-dot";
    dot.style.background=b.color;
    const tx=document.createElement("span");
    tx.textContent=b.label; // textContent: label из конфига не интерпретируется как разметка
    el.appendChild(dot);
    el.appendChild(tx);
    legend.appendChild(el);
  });
}
function drawLines(canvas,lines,t0,t1,zeroLine){
  const ctx=canvas.getContext("2d");
  const W=canvas.width,H=canvas.height,pad=32;
  ctx.clearRect(0,0,W,H);
  if(!lines.length||!(t1>t0)) return;
  let min=0,max=0;
  lines.forEach(l=>l.pts.forEach(p=>{
    if(p.v<min)min=p.v; if(p.v>max)max=p.v;
  }));
  if(max===min) max=min+1;
  const span=t1-t0;
  const X=t=>pad+((t-t0)/span)*(W-pad*2);
  const Y=v=>H-pad-((v-min)/(max-min))*(H-pad*2);
  ctx.strokeStyle="#2a2a2e"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad+i*(H-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();}
  if(zeroLine&&min<0&&max>0){
    ctx.strokeStyle="#55555c"; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(pad,Y(0)); ctx.lineTo(W-pad,Y(0)); ctx.stroke();
    ctx.setLineDash([]);
  }
  lines.forEach(l=>{
    if(!l.pts.length) return;
    ctx.strokeStyle=l.color||"#6da5ff"; ctx.lineWidth=2.2; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    l.pts.forEach((p,i)=>{
      const x=X(p.t),y=Y(p.v);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
  ctx.fillStyle="#8a90a3"; ctx.font="10px sans-serif"; ctx.textAlign="left";
  ctx.fillText(fmtNum(max),6,12);
  ctx.fillText(fmtNum(min),6,H-4);
  ctx.fillText(new Date(t0).toLocaleDateString(),pad,H-6);
  const eLabel=new Date(t1).toLocaleDateString();
  ctx.fillText(eLabel,W-pad-ctx.measureText(eLabel).width,H-6);
}
function drawBar(canvas, labels, values, colors){
  const ctx=canvas.getContext("2d");
  const W=canvas.width, H=canvas.height, pad=32;
  ctx.clearRect(0,0,W,H);
  if(!labels.length) return;
  const max=Math.max(1,...values);
  const n=labels.length;
  const gap=8;
  const barW=(W-pad*2 - gap*(n-1))/n;
  ctx.strokeStyle="#2a2a2e"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=pad+i*(H-pad*2)/4; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); }
  labels.forEach((lab,i)=>{
    const v=values[i];
    const h=(v/max)*(H-pad*2);
    const x=pad + i*(barW+gap);
    const y=H-pad - h;
    ctx.fillStyle=colors[i]||"#6da5ff";
    ctx.fillRect(x,y,barW,h);
    ctx.fillStyle="#c2c8d6"; ctx.font="10px sans-serif"; ctx.textAlign="center";
    const tx=x+barW/2;
    let txt=lab.length>8?lab.slice(0,8)+"…":lab;
    ctx.fillText(txt, tx, H-pad+12);
    ctx.fillStyle="#8a90a3";
    ctx.fillText(String(v), tx, y-4);
  });
  ctx.textAlign="left";
}
function render(S){
  S=S||{};
  const points=S.points||0, btns=S.buttons||[], curves=S.curves||[];
  const t0=(S.window&&S.window.t0)||0, t1=(S.window&&S.window.t1)||0;
  document.getElementById("total").textContent=points+" points • "+btns.length+" кнопок";
  fillLegend("legend-cumulative",btns);
  fillLegend("legend-p1",btns);
  fillLegend("legend-p2",btns);
  // raw rows
  const tbody=document.querySelector("#t-raw tbody");
  tbody.innerHTML="";
  const recent=S.recent||[];
  if(!recent.length){ show("e-raw",true); }
  else {
    show("e-raw",false);
    recent.forEach(r=>{
      const tr=document.createElement("tr");
      // textContent: без инъекции разметки из данных
      [String(r[0]).slice(0,8), r[1], String(r[2]), fmtTime(r[2])].forEach(c=>{
        const td=document.createElement("td");
        td.textContent=c;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }
  const hasData=points>0&&btns.length>0&&(t1>t0);
  const asLines=key=>curves.map(c=>({color:c.color,pts:c[key]||[]}));
  const anyPts=key=>curves.some(c=>(c[key]||[]).length>0);
  // cumulative / производные панели
  [["cumulative","c-cumulative","e-cumulative",false],
   ["p1","c-p1","e-p1",false],
   ["p2","c-p2","e-p2",true]].forEach(([key,cid,eid,zero])=>{
    const on=hasData&&anyPts(key);
    show(cid,on); show(eid,!on);
    if(on) drawLines(document.getElementById(cid),asLines(key),t0,t1,zero);
  });
  // totals per button
  if(!points){ show("c-totals",false); show("e-totals",true); }
  else {
    show("c-totals",true); show("e-totals",false);
    const totals=S.totals||{};
    drawBar(document.getElementById("c-totals"),
            btns.map(b=>b.label),
            btns.map(b=>totals[b.id]||0),
            btns.map(b=>b.color));
  }
}
function init(){
  let S=window.SAMOPISEC_SERIES;
  if(!S&&window.__SAMOPISEC_SERIES) S=window.__SAMOPISEC_SERIES;
  try{ if(typeof S==="string") S=JSON.parse(S); }catch(e){}
  render(S);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();
</script>
</body>
</html>
